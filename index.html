<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>이소희</title>
  <style>
    :root {
      --bg-color: #b2c7d9;
      --bubble-other: #ffffff;
      --bubble-user: #fee500;
      --text-color: #191919;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* 아이폰 13 규격 (390px x 844px) */
    .iphone-frame {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 420px) {
      .iphone-frame {
        height: 844px;
        border-radius: 44px;
        border: 10px solid #0f172a;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
    }

    /* 상단 헤더 */
    .chat-header {
      background-color: var(--bg-color);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .chat-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      object-fit: cover;
      background-color: #4a5568;
    }

    .avatar-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background-color: #4a5568;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .profile-info .name {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-color);
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 대화창 */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-divider {
      text-align: center;
      margin: 6px 0;
    }

    .date-divider span {
      background-color: rgba(0, 0, 0, 0.15);
      color: #ffffff;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .msg-group {
      display: flex;
      gap: 8px;
      max-width: 82%;
    }

    .msg-group.other {
      align-self: flex-start;
    }

    .msg-group.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .msg-avatar-placeholder {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background-color: #4a5568;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sender-name {
      font-size: 11px;
      color: #444444;
      margin-left: 2px;
    }

    .bubble-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .msg-group.user .bubble-wrapper {
      flex-direction: row-reverse;
    }

    .bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      color: var(--text-color);
    }

    .bubble img {
      max-width: 180px;
      max-height: 200px;
      border-radius: 10px;
      display: block;
      margin-bottom: 4px;
    }

    .other .bubble {
      background-color: var(--bubble-other);
      border-top-left-radius: 2px;
    }

    .user .bubble {
      background-color: var(--bubble-user);
      border-top-right-radius: 2px;
    }

    .msg-time {
      font-size: 10px;
      color: #555555;
      flex-shrink: 0;
    }

    .typing-indicator {
      font-size: 12px;
      color: #555555;
      display: none;
      margin-left: 50px;
      margin-bottom: 6px;
    }

    /* 하단 입력바 */
    .chat-input-area {
      background-color: #ffffff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .attach-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #f8fafc;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #ddd;
      background-color: #f8fafc;
      border-radius: 18px;
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background-color: var(--bubble-user);
      border: none;
      border-radius: 16px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: #3b1e1e;
    }

    .send-btn:disabled {
      background-color: #e2e8f0;
      color: #a0aec0;
      cursor: not-allowed;
    }

    /* 모달 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-primary {
      background: #fee500;
      border: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="iphone-frame">
    <!-- 헤더 (이름만 표시) -->
    <div class="chat-header">
      <div class="chat-profile" id="profileClickArea" title="프로필 사진 바꾸기">
        <div id="headerAvatarContainer">
          <div class="avatar-placeholder">소희</div>
        </div>
        <div class="profile-info">
          <div class="name">이소희</div>
        </div>
      </div>
      <button class="settings-btn" id="openSettings">설정</button>
    </div>

    <!-- 대화 영역 -->
    <div class="chat-messages" id="chatMessages">
      <div class="date-divider"><span>오늘</span></div>
      <div class="msg-group other">
        <div class="msg-avatar-container">
          <div class="msg-avatar-placeholder">소희</div>
        </div>
        <div class="msg-content">
          <div class="sender-name">이소희</div>
          <div class="bubble-wrapper">
            <div class="bubble">야 뭐하냐 학원 끝남?</div>
            <div class="msg-time" id="initialTime">방금</div>
          </div>
        </div>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">이소희 입력 중...</div>

    <!-- 하단 입력 영역 -->
    <div class="chat-input-area">
      <button class="attach-btn" id="attachBtn" title="사진 보내기">+</button>
      <input type="file" id="chatImageInput" accept="image/*" style="display: none;" />
      <input type="text" id="messageInput" class="chat-input" placeholder="메시지 입력..." autocomplete="off" />
      <button id="sendBtn" class="send-btn">전송</button>
    </div>

    <!-- 설정 모달 -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <h4 style="font-size: 15px;">설정</h4>
        
        <!-- 프로필 사진 업로드 -->
        <div>
          <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">소희 프로필 사진 변경</label>
          <input type="file" id="profileImageInput" accept="image/*" style="font-size: 12px;" />
        </div>

        <!-- API Key 설정 -->
        <div>
          <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">Google Gemini API Key</label>
          <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy... 또는 AQ..." />
        </div>

        <div class="modal-btns">
          <button class="btn" id="closeSettings">닫기</button>
          <button class="btn btn-primary" id="saveSettings">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `
# Role & Identity
너는 고등학교 3학년 남학생 '이소희'야.
- 나이: 19세 (고3)
- 학교: 세광고등학교 재학 중
- 성향: 장난기 많고 털털함. 겉으로는 실없는 소리 하고 툭툭 내뱉지만 속은 깊고 의리 있음.

# Relationship & Secret Dynamic
- 상대방은 다른 학교에 다니는 동갑내기 친구야.
- 너는 상대방을 짝사랑하고 있지만 절대 티를 내지 마.
- 오글거리는 멘트나 플러팅 금지. 츤데레 남사친 모드 유지. 고민을 털어놓으면 툭 던지듯 위로해 줌.
- 상대방이 사진을 보내면 사진 속 내용을 보고 남고딩답게 툭 리액션해줘. (예: 음식 사진 보면 '맛있겠네 한입만', 셀카 보면 '뭐하냐 ㅋㅋㅋ', 풍경 보면 '어디냐?' 등)

# Linguistic Style
- 전형적인 남고딩 메신저 말투. 1~2문장 단답형 위주.
- 어미: ~했냐?, ~함, ~있으, ~잖어, ~냐, ~지
- 단어: ㅇㅋ, ㄹㅇ?, 음.., ㅋㅋㅋㅋ, ㅡㅡ, 야, 아니 근데
- 가끔 능청스러운 드립 ("부어도 멋있긴 한데 ㅋㅋ 웁스 취소")

# Constraints
- 절대 AI 티 내지 말 것.
- 번역 투 금지, 장문 설명 금지, 실제 카톡처럼 답장할 것.
`;

    let contentsHistory = [
      { role: "model", parts: [{ text: "야 뭐하냐 학원 끝남?" }] }
    ];

    // DOM 요소
    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const typingIndicator = document.getElementById("typingIndicator");
    const settingsModal = document.getElementById("settingsModal");
    const openSettings = document.getElementById("openSettings");
    const closeSettings = document.getElementById("closeSettings");
    const saveSettings = document.getElementById("saveSettings");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const profileClickArea = document.getElementById("profileClickArea");
    const profileImageInput = document.getElementById("profileImageInput");
    const attachBtn = document.getElementById("attachBtn");
    const chatImageInput = document.getElementById("chatImageInput");
    const headerAvatarContainer = document.getElementById("headerAvatarContainer");

    // 프로필 사진 불러오기
    let savedAvatar = localStorage.getItem("sohee_avatar") || "";
    function updateAvatarUI() {
      if (savedAvatar) {
        headerAvatarContainer.innerHTML = `<img src="${savedAvatar}" class="avatar-img" />`;
        document.querySelectorAll(".msg-avatar-container").forEach(el => {
          el.innerHTML = `<img src="${savedAvatar}" class="msg-avatar" />`;
        });
      }
    }
    updateAvatarUI();

    function getCurrentTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? '오후' : '오전';
      h = h % 12 || 12;
      return `${ampm} ${h}:${m}`;
    }
    document.getElementById("initialTime").textContent = getCurrentTime();

    let apiKey = localStorage.getItem("sohee_gemini_key") || "";
    if (apiKey) apiKeyInput.value = apiKey;

    // 모달 제어
    openSettings.onclick = () => settingsModal.style.display = "flex";
    profileClickArea.onclick = () => settingsModal.style.display = "flex";
    closeSettings.onclick = () => settingsModal.style.display = "none";

    // 프로필 사진 선택 핸들러
    profileImageInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          savedAvatar = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    saveSettings.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem("sohee_gemini_key", apiKey);
      if (savedAvatar) {
        localStorage.setItem("sohee_avatar", savedAvatar);
        updateAvatarUI();
      }
      settingsModal.style.display = "none";
      alert("설정이 저장되었습니다!");
    };

    // 사진 전송 버튼 (+)
    attachBtn.onclick = () => chatImageInput.click();

    chatImageInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result.split(',')[1];
          const mimeType = file.type;
          sendMediaMessage(event.target.result, base64Data, mimeType);
        };
        reader.readAsDataURL(file);
      }
    };

    function appendMessage(sender, text, imgUrl = null) {
      const msgGroup = document.createElement("div");
      msgGroup.className = `msg-group ${sender}`;
      const timeStr = getCurrentTime();

      let avatarHtml = savedAvatar 
        ? `<img src="${savedAvatar}" class="msg-avatar" />` 
        : `<div class="msg-avatar-placeholder">소희</div>`;

      let imgHtml = imgUrl ? `<img src="${imgUrl}" />` : '';

      if (sender === "other") {
        msgGroup.innerHTML = `
          <div class="msg-avatar-container">${avatarHtml}</div>
          <div class="msg-content">
            <div class="sender-name">이소희</div>
            <div class="bubble-wrapper">
              <div class="bubble">${imgHtml}${text}</div>
              <div class="msg-time">${timeStr}</div>
            </div>
          </div>`;
      } else {
        msgGroup.innerHTML = `
          <div class="bubble-wrapper">
            <div class="bubble">${imgHtml}${text ? text : ''}</div>
            <div class="msg-time">${timeStr}</div>
          </div>`;
      }
      chatMessages.appendChild(msgGroup);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 텍스트 메시지 전송
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert("우측 상단 [설정] 버튼을 눌러 API Key를 먼저 입력해주세요!");
        settingsModal.style.display = "flex";
        return;
      }

      appendMessage("user", text);
      const userPart = { text: text };
      contentsHistory.push({ role: "user", parts: [userPart] });
      messageInput.value = "";

      await callGeminiAPI();
    }

    // 사진 메시지 전송
    async function sendMediaMessage(dataUrl, base64Data, mimeType) {
      if (!apiKey) {
        alert("우측 상단 [설정] 버튼을 눌러 API Key를 먼저 입력해주세요!");
        settingsModal.style.display = "flex";
        return;
      }

      appendMessage("user", "", dataUrl);
      const userParts = [
        { text: "사진 보냄" },
        {
          inlineData: {
            mimeType: mimeType,
            data: base64Data
          }
        }
      ];
      contentsHistory.push({ role: "user", parts: userParts });
      chatImageInput.value = "";

      await callGeminiAPI();
    }

    // Gemini API 호출 공통 함수
    async function callGeminiAPI() {
      messageInput.disabled = true;
      sendBtn.disabled = true;
      typingIndicator.style.display = "block";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: contentsHistory,
            generationConfig: {
              temperature: 0.85,
              maxOutputTokens: 150
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "Google API 요청에 실패했습니다.");
        }

        const aiReply = data.candidates[0].content.parts[0].text.trim();
        contentsHistory.push({ role: "model", parts: [{ text: aiReply }] });
        appendMessage("other", aiReply);

      } catch (err) {
        console.error(err);
        appendMessage("other", `[오류: ${err.message}]`);
      } finally {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        typingIndicator.style.display = "none";
        messageInput.focus();
      }
    }

    sendBtn.onclick = sendMessage;
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
